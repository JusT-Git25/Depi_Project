[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-lab-ocr-feature"
version = "0.2.0"
description = "OCR, structured extraction and model-based risk prediction for medical laboratory reports"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10,<1", "opencv-python-headless>=4.9,<5"]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1", "python-multipart>=0.0.9"]
predict = ["scikit-learn>=1.3,<2", "joblib>=1.3,<2", "pandas>=2.1,<4"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1"]

[project.scripts]
lab-ocr = "lab_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lab_ocr*"]

[tool.setuptools.package-data]
lab_ocr = ["mappings/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-q"
