[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liver-disease-prediction"
version = "1.0.0"
description = "Backend-ready Liver Disease Prediction ML System built on the Indian Liver Patient Dataset (ILPD)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scipy>=1.13.0,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "imbalanced-learn>=0.12.0,<1.0.0",
    "xgboost>=2.1.0,<4.0.0",
    "lightgbm>=4.5.0,<5.0.0",
    "catboost>=1.2.7,<2.0.0",
    "shap>=0.46.0,<1.0.0",
    "joblib>=1.4.0,<2.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "seaborn>=0.13.2,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "requests>=2.32.0,<3.0.0",
    "streamlit>=1.39.0,<2.0.0",
    "plotly>=5.24.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "nbformat>=5.10.0,<6.0.0",
    "nbclient>=0.10.0,<1.0.0",
    "ipykernel>=6.29.0,<7.0.0",
    "ruff>=0.7.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["Depi_Project", ".venv", ".git", "artifacts", "data", "docs", "notebooks"]
addopts = "-v --tb=short"
